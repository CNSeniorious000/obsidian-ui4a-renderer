<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAC-10814 verification</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #111217; color: #ececf4; }
      body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 12% 0%, #432f6e55, transparent 36%), radial-gradient(circle at 88% 100%, #20485b44, transparent 34%); }
      main { width: 1360px; min-height: 820px; margin: 0 auto; padding: 46px 52px; position: relative; }
      header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; }
      .eyebrow { color: #a88bfa; font-size: 14px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 7px 0 0; font-size: 34px; letter-spacing: -.03em; }
      .state { border: 1px solid; border-radius: 999px; padding: 9px 16px; font-weight: 800; letter-spacing: .08em; }
      .state.before { color: #ffb4a8; border-color: #d55a4e; background: #3b1d1b; }
      .state.after { color: #a8f0c5; border-color: #3a9e66; background: #153525; }
      .operation { display: flex; align-items: center; gap: 11px; padding: 14px 18px; margin-bottom: 24px; border: 1px solid #3a3b47; border-radius: 12px; background: #1b1c23dd; color: #c8c9d5; }
      .operation b { color: #fff; }
      .grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 22px; }
      .notes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .notes.one { grid-template-columns: 1fr; }
      .panel { overflow: hidden; border: 1px solid #393a46; border-radius: 14px; background: #1a1b22e8; box-shadow: 0 16px 42px #0005; }
      .panel-title { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 17px; border-bottom: 1px solid #343540; color: #dedee8; font-weight: 750; }
      .path { color: #9b9cab; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .editor { min-height: 440px; padding: 16px 0; background: #15161c; font: 14px/1.72 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .line { display: grid; grid-template-columns: 36px 1fr; padding: 0 16px 0 8px; white-space: pre-wrap; }
      .line-no { color: #555765; user-select: none; }
      .line.intent { background: #674ad52b; color: #dccfff; border-left: 3px solid #9b7bf2; padding-left: 5px; }
      .sidebar { padding: 20px; }
      .sidebar h2 { margin: 0 0 18px; font-size: 18px; }
      .metric-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .metric { padding: 16px; border: 1px solid #393a46; border-radius: 12px; background: #15161c; }
      .metric strong { display: block; margin-top: 7px; font-size: 31px; }
      .metric span { color: #989aa9; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
      .timeline { display: grid; gap: 10px; margin-top: 18px; }
      .event { display: flex; gap: 10px; align-items: center; padding: 12px 13px; border-radius: 10px; background: #24252e; color: #cfd0da; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #8d72dc; flex: 0 0 auto; }
      .event.good .dot { background: #55ca86; box-shadow: 0 0 0 4px #55ca8622; }
      .event.bad .dot { background: #ee7064; box-shadow: 0 0 0 4px #ee706422; }
      .toast { margin-top: 17px; padding: 14px; border-radius: 10px; font-weight: 750; }
      .toast.success { color: #b9f2cf; background: #183b29; border: 1px solid #347a51; }
      .toast.failure { color: #ffc3bd; background: #42201e; border: 1px solid #91483f; }
      .verdict { margin-top: 16px; padding: 15px; border-left: 3px solid #8f75de; background: #24222f; color: #d6cee9; line-height: 1.45; }
      footer { margin-top: 22px; color: #777987; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body><main id="app"></main><script src="./dist/evidence.js"></script></body>
</html>
