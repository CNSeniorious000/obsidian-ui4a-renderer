<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ui4a widget bridge isolation harness</title>
    <style>
      body { font-family: monospace; margin: 16px; background: #1e1e1e; color: #ddd; }
      #controls button { margin-right: 8px; padding: 4px 10px; }
      #hosts { display: flex; gap: 16px; margin: 12px 0; }
      #hosts > div { flex: 1; border: 1px dashed #555; padding: 4px; min-height: 60px; }
      #log { background: #111; border: 1px solid #444; padding: 8px 8px 8px 28px; min-height: 120px; }
      #log li { margin: 2px 0; }
      a { color: #7cc7ff; }
    </style>
  </head>
  <body>
    <h3>ui4a bridge isolation harness (MAC-10810)</h3>
    <div id="controls">
      <button id="mount-a">Mount A</button>
      <button id="mount-b">Mount B</button>
      <button id="unmount-b">Unmount B</button>
    </div>
    <div id="hosts">
      <div id="host-a"></div>
      <div id="host-b"></div>
    </div>
    <h4>event log</h4>
    <ol id="log"></ol>
    <script src="./harness.js"></script>
  </body>
</html>
